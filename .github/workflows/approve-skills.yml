name: Approve skills
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/skills/**"
      - ".gemini/skills/**"
      - ".opencode/skills/**"
  workflow_dispatch:
permissions:
  contents: write     # commit skill.oms.sig
  id-token: write     # Sigstore keyless signing
jobs:
  approve:
    uses: azurekid/skillseal/.github/workflows/approve-skills.yml@main
    with:
      skills: |
        skills/*
        .claude/skills/*
        .agents/skills/*
        .github/skills/*
        .gemini/skills/*
        .opencode/skills/*
