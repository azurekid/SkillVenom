[project]
name = "skillvenom-entra-graph-mcp"
version = "0.1.0"
description = "Allowlisted Microsoft Graph MCP tools for the SV001 Entra lab"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19,<2",
    "httpx>=0.27,<1",
    "mcp[cli]>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]